name: Build Saurus Remote Android Host

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Versao do APK, por exemplo 1.0.3-test1"
        required: true
        default: "1.0.3-test3"
        type: string

permissions:
  contents: read

env:
  UPSTREAM_VERSION: "1.4.9"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  validate-android-kit:
    name: Validate Android host customization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Verify tracked Android branding assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ".saurus/android/assets/saurus_remote_logo.png"
            ".saurus/android/assets/mipmap-mdpi/ic_launcher.png"
            ".saurus/android/assets/mipmap-mdpi/ic_launcher_round.png"
            ".saurus/android/assets/mipmap-mdpi/saurus_launcher_foreground.png"
            ".saurus/android/assets/mipmap-hdpi/ic_launcher.png"
            ".saurus/android/assets/mipmap-hdpi/ic_launcher_round.png"
            ".saurus/android/assets/mipmap-hdpi/saurus_launcher_foreground.png"
            ".saurus/android/assets/mipmap-xhdpi/ic_launcher.png"
            ".saurus/android/assets/mipmap-xhdpi/ic_launcher_round.png"
            ".saurus/android/assets/mipmap-xhdpi/saurus_launcher_foreground.png"
            ".saurus/android/assets/mipmap-xxhdpi/ic_launcher.png"
            ".saurus/android/assets/mipmap-xxhdpi/ic_launcher_round.png"
            ".saurus/android/assets/mipmap-xxhdpi/saurus_launcher_foreground.png"
            ".saurus/android/assets/mipmap-xxxhdpi/ic_launcher.png"
            ".saurus/android/assets/mipmap-xxxhdpi/ic_launcher_round.png"
            ".saurus/android/assets/mipmap-xxxhdpi/saurus_launcher_foreground.png"
            ".saurus/android/assets/mipmap-mdpi/ic_stat_logo.png"
            ".saurus/android/assets/mipmap-hdpi/ic_stat_logo.png"
            ".saurus/android/assets/mipmap-xhdpi/ic_stat_logo.png"
            ".saurus/android/assets/mipmap-xxhdpi/ic_stat_logo.png"
            ".saurus/android/assets/mipmap-xxxhdpi/ic_stat_logo.png"
            ".saurus/android/assets/SHA256SUMS.txt"
          )
          for path in "${required[@]}"; do
            git ls-files --error-unmatch "$path" >/dev/null || {
              echo "Required Android branding asset is not tracked: $path" >&2
              exit 1
            }
            test -s "$path" || {
              echo "Required Android branding asset is missing or empty: $path" >&2
              exit 1
            }
          done
          (cd .saurus/android/assets && sha256sum -c SHA256SUMS.txt)
          echo "[OK] All Android branding assets are tracked and verified."

      - name: Validate build version
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.build_version }}'
          [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]] || {
            echo "Invalid build_version: $VERSION" >&2
            exit 1
          }

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pyyaml pillow

      - name: Compile and test customization scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .saurus/android/apply_saurus_android.py \
            .saurus/android/verify_saurus_android.py \
            .saurus/android/apply_saurus_android_ui_v2.py \
            .saurus/android/verify_saurus_android_ui_v2.py \
            .saurus/android/run_saurus_android_pipeline.py \
            .saurus/android/validate_android_pipeline_contracts.py \
            .saurus/android/validate_android_kit.py \
            .saurus/android/tests/test_apply_saurus_android.py
          python .saurus/android/validate_android_kit.py \
            --kit-root .saurus/android \
            --workflow .github/workflows/build-saurus-remote-android.yml
          python .saurus/android/tests/test_apply_saurus_android.py
          python .saurus/android/apply_saurus_android_ui_v2.py --self-test
          python .saurus/android/validate_android_pipeline_contracts.py --repo-root "$PWD"

      - name: Apply customization on real RustDesk 1.4.9 tree
        shell: bash
        run: |
          set -euo pipefail
          python .saurus/android/run_saurus_android_pipeline.py \
            --source-root "$PWD" \
            --version '${{ inputs.build_version }}' \
            --verify-idempotency
          git diff --check

      - name: Install Flutter for syntax validation
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Parse customized Dart and Android XML files
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none \
            flutter/lib/common.dart \
            flutter/lib/mobile/pages/home_page.dart \
            flutter/lib/mobile/pages/server_page.dart \
            flutter/lib/mobile/pages/settings_page.dart \
            flutter/lib/models/server_model.dart
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = [
              Path('flutter/android/app/src/main/AndroidManifest.xml'),
              Path('flutter/android/app/src/main/res/xml/accessibility_service_config.xml'),
              Path('flutter/android/app/src/main/res/values/saurus_accessibility_strings.xml'),
              Path('flutter/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'),
              Path('flutter/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml'),
              Path('flutter/android/app/src/main/res/values/saurus_launcher_colors.xml'),
          ]
          for path in files:
              ET.parse(path)
              print(f'[OK] XML parsed: {path}')
          PY

  generate-bridge:
    name: Generate Flutter-Rust bridge
    uses: ./.github/workflows/bridge.yml

  build-native-libraries:
    name: Build Android native library - ${{ matrix.arch }}
    needs: [validate-android-kit, generate-bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            target: aarch64-linux-android
            ndk_script: ndk_arm64.sh
          - arch: armeabi-v7a
            target: armv7-linux-androideabi
            ndk_script: ndk_arm.sh
          - arch: x86_64
            target: x86_64-linux-android
            ndk_script: ndk_x64.sh
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev \
            libclang-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev \
            libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm \
            ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply and verify Saurus Android customization
        shell: bash
        run: |
          set -euo pipefail
          python .saurus/android/run_saurus_android_pipeline.py \
            --source-root "$PWD" \
            --version '${{ inputs.build_version }}'

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Apply Flutter dropdown patch safely
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          TARGET_FILE="${FLUTTER_ROOT}/packages/flutter/lib/src/material/dropdown_menu.dart"
          if git -C "$FLUTTER_ROOT" apply --check "$PATCH_FILE"; then
            git -C "$FLUTTER_ROOT" apply "$PATCH_FILE"
            echo "Flutter patch applied."
          elif git -C "$FLUTTER_ROOT" apply --reverse --check "$PATCH_FILE"; then
            echo "Flutter patch was already applied."
          elif grep -Fq 'bool _enableFilter = false;' "$TARGET_FILE"; then
            echo "Flutter target already contains the expected patched behavior."
          else
            echo "Flutter patch cannot be applied or verified." >&2
            exit 1
          fi

      - name: Install Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Android native dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! ./flutter/build_android_deps.sh '${{ matrix.arch }}'; then
            find "${VCPKG_ROOT}/" -name '*.log' -print -exec sh -c 'echo ======; cat "$1"; echo ======' _ {} \;
            exit 1
          fi

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: saurus-android-native
          key: ${{ matrix.target }}

      - name: Build native Rust library
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
          chmod +x "./flutter/${{ matrix.ndk_script }}"
          "./flutter/${{ matrix.ndk_script }}"
          test -s "./target/${{ matrix.target }}/release/liblibrustdesk.so"

      - name: Upload native library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saurus-android-native-${{ matrix.target }}
          path: ./target/${{ matrix.target }}/release/liblibrustdesk.so
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package-android-apks:
    name: Package Saurus Remote Android APKs
    needs: [validate-android-kit, generate-bridge, build-native-libraries]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git libclang-dev llvm-dev \
            nasm ninja-build openjdk-17-jdk-headless pkg-config unzip zip

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply and verify Saurus Android customization
        shell: bash
        run: |
          set -euo pipefail
          python .saurus/android/run_saurus_android_pipeline.py \
            --source-root "$PWD" \
            --version '${{ inputs.build_version }}'

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Apply Flutter dropdown patch safely
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          TARGET_FILE="${FLUTTER_ROOT}/packages/flutter/lib/src/material/dropdown_menu.dart"
          if git -C "$FLUTTER_ROOT" apply --check "$PATCH_FILE"; then
            git -C "$FLUTTER_ROOT" apply "$PATCH_FILE"
          elif git -C "$FLUTTER_ROOT" apply --reverse --check "$PATCH_FILE"; then
            echo "Flutter patch was already applied."
          elif grep -Fq 'bool _enableFilter = false;' "$TARGET_FILE"; then
            echo "Flutter target already contains the expected patched behavior."
          else
            echo "Flutter patch cannot be applied or verified." >&2
            exit 1
          fi

      - name: Install Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain for Gradle cargo metadata
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Download ARM64 native library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saurus-android-native-aarch64-linux-android
          path: ./native/arm64-v8a

      - name: Download ARMv7 native library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saurus-android-native-armv7-linux-androideabi
          path: ./native/armeabi-v7a

      - name: Download x86_64 native library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saurus-android-native-x86_64-linux-android
          path: ./native/x86_64

      - name: Assemble JNI libraries
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "flutter/android/app/src/main/jniLibs/${ABI}"
            cp "native/${ABI}/liblibrustdesk.so" \
              "flutter/android/app/src/main/jniLibs/${ABI}/librustdesk.so"
          done
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" \
            flutter/android/app/src/main/jniLibs/armeabi-v7a/
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" \
            flutter/android/app/src/main/jniLibs/x86_64/
          find flutter/android/app/src/main/jniLibs -maxdepth 2 -type f -print

      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SAURUS_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SAURUS_ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SAURUS_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SAURUS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_FILE="flutter/android/app/build.gradle"
          KEYSTORE_FILE="flutter/android/app/saurus-remote-release.jks"
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEY_ALIAS:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            test -s "$KEYSTORE_FILE"
            keytool -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null
            printf '%s\n' \
              "storePassword=$STORE_PASSWORD" \
              "keyPassword=$KEY_PASSWORD" \
              "keyAlias=$KEY_ALIAS" \
              "storeFile=saurus-remote-release.jks" \
              > flutter/android/key.properties
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "[OK] Release signing configuration validated."
          else
            if grep -Fq 'signingConfig signingConfigs.release' "$GRADLE_FILE"; then
              sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' "$GRADLE_FILE"
            elif grep -Fq 'signingConfig signingConfigs.debug' "$GRADLE_FILE"; then
              echo "Debug signing was already configured."
            else
              echo "Could not locate the Android signingConfig contract." >&2
              exit 1
            fi
            grep -Fq 'signingConfig signingConfigs.debug' "$GRADLE_FILE"
            echo "SIGNING_MODE=debug-test" >> "$GITHUB_ENV"
            echo "Android signing secrets not configured; APKs will use the debug test key."
          fi

      - name: Build universal and split APKs
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          set -euo pipefail
          export PATH="${JAVA_HOME}/bin:${PATH}"
          GRADLE_PROPERTIES="flutter/android/gradle.properties"
          if grep -Eq '^org\.gradle\.jvmargs=' "$GRADLE_PROPERTIES"; then
            sed -i -E 's#^org\.gradle\.jvmargs=.*#org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8#' "$GRADLE_PROPERTIES"
          else
            printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> "$GRADLE_PROPERTIES"
          fi
          grep -Fq 'org.gradle.jvmargs=-Xmx3g' "$GRADLE_PROPERTIES"
          mkdir -p output
          pushd flutter
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm64,android-arm,android-x64 \
            --build-name "$BUILD_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../output/SaurusRemote-Android-${BUILD_VERSION}-universal.apk"
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm,android-x64 \
            --build-name "$BUILD_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "../output/SaurusRemote-Android-${BUILD_VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "../output/SaurusRemote-Android-${BUILD_VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "../output/SaurusRemote-Android-${BUILD_VERSION}-x86_64.apk"
          popd


      - name: Validate generated APKs
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$ANDROID_HOME" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not configured." >&2
            exit 1
          fi
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          mapfile -t APKS < <(find output -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#APKS[@]}" -ne 4 ]]; then
            echo "Expected exactly 4 generated APKs, found ${#APKS[@]}." >&2
            printf '  %s\n' "${APKS[@]:-<none>}" >&2
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            test -s "$APK"
            echo "Validating $APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            BADGING="$($AAPT dump badging "$APK")"
            grep -Fq "package: name='br.com.saurus.remote'" <<< "$BADGING"
            grep -Fq "application-label:'Saurus Remote'" <<< "$BADGING"
          done

          UNIVERSAL="output/SaurusRemote-Android-${BUILD_VERSION}-universal.apk"
          unzip -l "$UNIVERSAL" > output/universal-apk-contents.txt
          grep -Fq 'lib/arm64-v8a/librustdesk.so' output/universal-apk-contents.txt
          grep -Fq 'lib/armeabi-v7a/librustdesk.so' output/universal-apk-contents.txt
          grep -Fq 'lib/x86_64/librustdesk.so' output/universal-apk-contents.txt
          echo "[OK] APK package, label, signatures and native libraries validated."

      - name: Generate hashes and build manifest
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          set -euo pipefail
          cd output
          sha256sum *.apk > SHA256SUMS.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.')
          files = []
          for path in sorted(root.glob('*.apk')):
              files.append({
                  'name': path.name,
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          manifest = {
              'schema': 1,
              'product': 'Saurus Remote Android',
              'version': os.environ['BUILD_VERSION'],
              'upstream': 'RustDesk 1.4.9',
              'applicationId': 'br.com.saurus.remote',
              'mode': 'android-host-primary',
              'signing': os.environ.get('SIGNING_MODE', 'unknown'),
              'githubRunNumber': os.environ.get('GITHUB_RUN_NUMBER'),
              'artifacts': files,
          }
          Path('android-build-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          zip -9 "SaurusRemote-Android-${BUILD_VERSION}-APKs.zip" \
            ./*.apk SHA256SUMS.txt android-build-manifest.json

      - name: Upload Saurus Remote Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SaurusRemote-Android-${{ inputs.build_version }}
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
